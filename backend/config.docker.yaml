app_name: onde-pilot

targets:
  - name: user-api
    base_url: "http://host.docker.internal:8080"
  - name: admin-api
    base_url: "http://host.docker.internal:8081"

inventory:
  markdown:
    enabled: true
    path: "/workspace/2단계(정보 수집 및 자산 분석 - 엔드포인트 수집)_Onde_엔드포인트_구조_정의서_v2.md"
    include_frontend_routes: true
    frontend_base_url: "http://localhost:5173"
  openapi:
    enabled: false
    path: ""
    base_url: "http://host.docker.internal:8080"
  url_list:
    enabled: false
    path: "data/inventory-urls.json"

zap:
  proxy: "http://zap:8090"
  api_key: ""
  auto_wait: true
  wait_seconds: 90

discover:
  openapi_import: true
  seed_requestor: true
  max_seeds: 0
  spider_enabled: true
  spider_max_seconds: 120
  ajax_spider_enabled: true
  ajax_spider_max_seconds: 120

auth:
  # Login page URLs → Dashboard Base URLs. Field names for login POST body only.
  login_url: "http://host.docker.internal:8080/api/v1/auth/login"
  id_field: email
  pw_field: password
  token_field: cookie.accessToken
  delivery: cookie
  cookie_name: accessToken

diagnosis_2_1:
  timeout: 15.0
  max_targets: 20
  httpx_enabled: true
  zap_enabled: false            # ZAP passive 스캔은 업로드 특성상 기본 비활성
  zap_passive_wait_seconds: 60
  interval_sec: 0.05            # 요청 간 딜레이(초) — 서버 rate limit 대응
  enable_auth_modes: true       # false 시 anonymous 패스만 실행
  allowed_extensions:           # 정상 허용 확장자 화이트리스트
    - jpg
    - jpeg
    - png
    - gif
    - webp

diagnosis_1_5:
  redirect_sink_base: "http://host.docker.internal:8001/argus-redirect-sink"
  probe_mode: sample
  sample_size: 60
  zap_enabled: false

diagnosis_4_1:
  probe_mode: sample
  sample_size: 40
  max_endpoints: 80
  timeout: 8.0
  max_pairs_per_endpoint: 12
  cross_cookie_enabled: true
  tamper_enabled: true
  tamper_max_endpoints: 30
  cookie_attr_enabled: true
  cookie_attr_strict: true
  auth_required_only: true
  partial_cross_tamper: true
  max_tamper_variants_per_session: 24
  auth_profiles:
    - bearer
    - cookie_access
    - cookie_refresh
    - dual
    - browser_full

diagnosis_5_2:
  probe_mode: sample
  sample_size: 40
  max_endpoints: 80
  timeout: 12.0
  interval_sec: 0.02
  check_request_url: true
  check_request_body: true
  check_response_body: true
  check_http_plain: true
  enable_auth_modes: true

diagnosis_6_1:
  probe_mode: sample
  sample_size: 40
  max_endpoints: 80
  max_requests: 8000
  timeout: 10.0
  interval_sec: 0.02
  long_lengths: [256, 1000, 5000]
  enable_param_fuzz: true
  enable_body_fuzz: true
  enable_path_fuzz: true
  enable_method_fuzz: true
  enable_header_fuzz: true
  enable_auth_modes: true
  httpx_enabled: true
  zap_enabled: true
  zap_unified_enabled: true
  zap_supplemental_enabled: true
  zap_max_requests: 8000
  zap_max_minutes: 15
  zap_seed_cap: 200

diagnosis_4_2:
  timeout: 10.0
  max_token_lifetime_minutes: 30
  min_token_length: 32
  min_entropy: 3.5
  probe_path: "/api/v1/members/me"
  relogin_enabled: true
  duplicate_login_enabled: true
  duplicate_login_ip_enabled: true
  probe_client_ips:
    - "203.0.113.10"
    - "198.51.100.20"
  logout_enabled: true
  logout_urls: []
  client_logout_enabled: true
  refresh_path: "/api/v1/auth/refresh"
  no_server_logout_finding: true
